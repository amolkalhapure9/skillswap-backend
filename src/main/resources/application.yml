spring:
  application:
    name: skillswap
  cache:
    type: redis
  data:
    redis:
      # Format: ${ENV_VAR_NAME:default_value}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  main:
    allow-circular-references: true
  datasource:
    # Full JDBC URL or construct dynamic host/port
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Allows switching to 'validate' or 'none' in production
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: "*"
